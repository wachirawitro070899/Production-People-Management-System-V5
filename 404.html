  const FIXED_DAY_SECTIONS = ['engineering support section','support production section'];
  window.ppmsNormalizeLegacyAttendanceShift = function(emp){
    if(!emp) return emp;
    const sec=String(emp.section||emp.Section||'').trim().toLowerCase();
    if(FIXED_DAY_SECTIONS.includes(sec)) emp.attShift='day';
    else { delete emp.attShift; delete emp.attendanceShift; }
    return emp;
  };
